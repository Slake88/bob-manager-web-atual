name: Publicar BOB REAL (manual)

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: Introduzir PUBLICAR-BOB-REAL para autorizar esta publicação
        required: true
        type: string
      commit_web:
        description: SHA completo do commit Web aprovado em main
        required: true
        type: string
      manifesto:
        description: Nome do ficheiro SHA-256 aprovado em .github/release-manifests
        required: true
        type: string
      manifesto_sha256:
        description: SHA-256 aprovado do ficheiro de checksums Web
        required: true
        type: string

permissions: {}

concurrency:
  group: pages-web-atual
  cancel-in-progress: false

jobs:
  preparar:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Slake88/bob-manager-web-atual' && github.ref == 'refs/heads/main' && inputs.confirmacao == 'PUBLICAR-BOB-REAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages

      - name: Validar manifesto e copiar apenas os assets aprovados
        shell: python
        env:
          APPROVED_COMMIT: ${{ inputs.commit_web }}
          MANIFEST_NAME: ${{ inputs.manifesto }}
          MANIFEST_SHA256: ${{ inputs.manifesto_sha256 }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          import hashlib
          import os
          import pathlib
          import re

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          domain = "bobmanager.blueonblack.pt"
          approved_commit = os.environ["APPROVED_COMMIT"]
          require(re.fullmatch(r"[0-9a-f]{40}", approved_commit)
                  and approved_commit == os.environ["GITHUB_SHA"],
                  "A execução não corresponde ao commit Web aprovado.")
          require(os.environ["PAGES_URL"] in (f"https://{domain}", f"https://{domain}/"),
                  "O destino Pages não corresponde ao domínio BOB REAL.")

          name = os.environ["MANIFEST_NAME"]
          checksum = os.environ["MANIFEST_SHA256"].lower()
          require(re.fullmatch(r"web-real-[A-Za-z0-9_-]+\.sha256", name)
                  and re.fullmatch(r"[0-9a-f]{64}", checksum),
                  "Indique um manifesto Web REAL e o respetivo SHA-256 aprovado.")

          root = pathlib.Path.cwd().resolve()
          manifest = root / ".github" / "release-manifests" / name
          require(manifest.is_file() and manifest.resolve() == manifest,
                  "O manifesto tem de ser um ficheiro regular no diretório aprovado.")
          manifest_bytes = manifest.read_bytes()
          require(hashlib.sha256(manifest_bytes).hexdigest() == checksum,
                  "O SHA-256 do manifesto difere do aprovado.")

          records = {}
          for line in manifest_bytes.decode("utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-fA-F]{64})  ([A-Za-z0-9._/-]+)", line)
              require(match, "Entrada inválida no manifesto de checksums.")
              digest, raw_path = match.groups()
              path = pathlib.PurePosixPath(raw_path)
              require(not path.is_absolute() and path.as_posix() == raw_path
                      and all(part not in {"..", "_site"} for part in path.parts)
                      and (raw_path == ".last_build_id"
                           or all(not part.startswith(".") for part in path.parts)),
                      "Caminho não publicável no manifesto.")
              require(raw_path not in records, f"Caminho duplicado: {raw_path}")
              records[raw_path] = digest.lower()

          require({"CNAME", "index.html", "flutter_bootstrap.js", "main.dart.js"} <= records.keys(),
                  "O manifesto não contém os ficheiros necessários ao Web REAL.")

          site = root / "_site"
          site.mkdir()
          for name, digest in records.items():
              path = pathlib.PurePosixPath(name)
              source = root.joinpath(*path.parts)
              require(source.is_file() and source.resolve() == source,
                      f"Ficheiro ausente ou ligado simbolicamente: {name}")
              data = source.read_bytes()
              require(hashlib.sha256(data).hexdigest() == digest,
                      f"Hash do ficheiro difere do aprovado: {name}")
              target = site.joinpath(*path.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          require((site / "CNAME").read_text(encoding="utf-8").strip() == domain,
                  "O CNAME do pacote não corresponde a BOB REAL.")
          require(b'<base href="/">' in (site / "index.html").read_bytes(),
                  "O index.html não está configurado para a raiz do domínio.")
          bundle = (site / "main.dart.js").read_bytes()
          require(b"https://oeqnncnyonvgtqqhdeth.supabase.co" in bundle
                  and b"vgjwghzypumtxvbuhwwl" not in bundle,
                  "O build Web não corresponde ao projeto Supabase REAL.")
          print(f"Manifesto aprovado para {approved_commit}. {len(records)} ficheiros verificados.")

      # A revisão v4 usada em TESTE exclui ficheiros ocultos do tar, incluindo .last_build_id.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        id: upload
        with:
          name: github-pages
          path: _site
          retention-days: 7

  publicar:
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar disponibilidade e identidade do artefacto do Pages
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.preparar.outputs.artifact_id }}
        run: |
          import datetime
          import json
          import os
          import re
          import subprocess
          import time

          def verify_artifact(payload, expected_id, run_id, repository_id, sha, now):
              if not isinstance(payload, dict) or type(payload.get("total_count")) is not int:
                  raise SystemExit("Resposta inválida da API de artefactos.")
              entries = payload.get("artifacts")
              count = payload["total_count"]
              if not isinstance(entries, list) or count != len(entries):
                  raise SystemExit("A listagem de artefactos está incompleta ou é inconsistente.")
              if count == 0:
                  return False
              if count != 1:
                  raise SystemExit("Existe mais de um artefacto github-pages nesta execução.")
              artifact = entries[0]
              if not isinstance(artifact, dict) or artifact.get("name") != "github-pages":
                  raise SystemExit("Nome ou formato inesperado do artefacto de publicação.")
              if artifact.get("id") != expected_id:
                  raise SystemExit("O ID do artefacto difere do output da tarefa preparar.")
              run = artifact.get("workflow_run")
              if (not isinstance(run, dict) or run.get("id") != run_id
                      or run.get("repository_id") != repository_id
                      or run.get("head_repository_id") != repository_id
                      or run.get("head_sha") != sha or run.get("head_branch") != "main"):
                  raise SystemExit("O artefacto pertence a outro repositório, execução ou commit.")
              try:
                  expires = datetime.datetime.fromisoformat(artifact["expires_at"])
              except (KeyError, TypeError, ValueError):
                  raise SystemExit("A validade do artefacto não foi confirmada.") from None
              if artifact.get("expired") is not False or expires.tzinfo is None or expires <= now:
                  raise SystemExit("O artefacto github-pages expirou ou tem validade inválida.")
              return True

          def wait_for_artifact(fetch, check, clock=time.monotonic, sleep=time.sleep):
              deadline = clock() + 120
              while True:
                  started = clock()
                  remaining = deadline - started
                  if remaining <= 0:
                      raise SystemExit("O artefacto github-pages não ficou disponível em 120 segundos.")
                  payload = fetch(remaining)
                  available = check(payload)
                  if available and clock() <= deadline:
                      return
                  delay = min(started + 5, deadline) - clock()
                  if delay > 0:
                      sleep(delay)

          def main():
              repository = os.environ["GITHUB_REPOSITORY"]
              sha = os.environ["GITHUB_SHA"]
              if (repository != "Slake88/bob-manager-web-atual"
                      or os.environ["GITHUB_REF"] != "refs/heads/main"
                      or not re.fullmatch(r"[0-9a-f]{40}", sha)):
                  raise SystemExit("A execução não corresponde ao destino Web REAL.")
              ids = [os.environ[key] for key in
                     ("EXPECTED_ARTIFACT_ID", "GITHUB_RUN_ID", "GITHUB_REPOSITORY_ID")]
              if not all(re.fullmatch(r"[1-9][0-9]*", value) for value in ids):
                  raise SystemExit("Faltam identificadores válidos de artefacto, execução ou repositório.")
              artifact_id, run_id, repository_id = map(int, ids)
              endpoint = (f"repos/{repository}/actions/runs/{run_id}/artifacts"
                          "?name=github-pages&per_page=100")

              def fetch(remaining):
                  try:
                      result = subprocess.run(
                          ["gh", "api", "--hostname", "github.com", "--method", "GET",
                           "-H", "Accept: application/vnd.github+json",
                           "-H", "X-GitHub-Api-Version: 2022-11-28", endpoint],
                          capture_output=True, check=True, timeout=remaining,
                      )
                      return json.loads(result.stdout)
                  except subprocess.TimeoutExpired:
                      raise SystemExit("A API de artefactos não respondeu dentro do prazo de 120 segundos.") from None
                  except (OSError, subprocess.CalledProcessError, ValueError):
                      raise SystemExit("A API de artefactos não devolveu uma resposta válida.") from None

              def check(payload):
                  return verify_artifact(payload, artifact_id, run_id, repository_id, sha,
                                         datetime.datetime.now(datetime.timezone.utc))

              wait_for_artifact(fetch, check)
              print(f"Artefacto github-pages {artifact_id} confirmado na execução {run_id}.")

          if __name__ == "__main__":
              main()

      - name: Publicar no GitHub Pages REAL
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages
